[application]

[android.permissions]
"android.permission.INTERNET" = { description = "Network access for push notifications" }
"android.permission.POST_NOTIFICATIONS" = { description = "Show push notifications" }
"android.permission.RECORD_AUDIO" = { description = "Record audio for pronounciation checker"}

[android]
custom_manifest = "android/AndroidManifest.xml"

[ios]
deployment_target = "16.0"
background_modes = ["audio"]

[ios.info_plist]
NSMicrophoneUsageDescription = "Record audio for pronunciation checker"

[ios.entitlements]
aps-environment = "development" # Change to "production" for release builds

[web.app]

# HTML title tag content
title = "test-app"

# include `assets` in web platform
[web.resource]

# Additional CSS style files
style = []

# Additional JavaScript files
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []

[bundle]
identifier = "com.example.TestApp"
publisher = "ExampleLabs"
icon = ["assets/icon.png"]
