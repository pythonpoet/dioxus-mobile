[package]
name = "test-app"
version = "0.1.0"
authors = ["David Wild <you@example.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
dioxus-fcm = { workspace = true }
dioxus-recorder = { workspace = true }
dioxus-jwt = { workspace = true, features = ["client"] }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
futures-core = "0.3"
thiserror = "2"

# platform crates additionally:
tokio = { version = "1", features = ["sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# futures-util = "0.3"
once_cell = "1"
tracing = { version = "0.1.44", features = ["log"], optional = true}


cpal = { version = "0.15", optional = true }
hound = { version = "3.5", optional = true }
futures-util = { version = "0.3", optional = true }
nnnoiseless = { version = "0.5", optional = true }
ringbuf = { version = "0.4", features = ["alloc"], optional = true }
parking_lot = { version = "0.12", optional = true }

[features]
default = ["mobile", "tracing"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop", "recorder"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile", "recorder"]
# Build the axum auth server host. Run with:
#   cargo run --no-default-features --features server,tracing
server = ["dioxus/server", "dioxus-jwt/server"]

# Client-only audio recorder page. Excluded from `server` (headless host) and
# `web` (cpal has no wasm backend), so those builds do not need ALSA.
recorder = [
    "dep:cpal",
    "dep:hound",
    "dep:futures-util",
    "dep:nnnoiseless",
    "dep:ringbuf",
    "dep:parking_lot",
]
