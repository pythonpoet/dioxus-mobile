# iOS boot + navigation smoke test for the dioxus-mobile test-app.
#
# Prerequisites (on the macos runner, before `maestro test`):
#   1. Build the app:  dx build --platform ios --release
#   2. Boot a simulator and install the .app bundle (path lives under target/dx/):
#        xcrun simctl boot booted 2>/dev/null || true
#        xcrun simctl install booted <path>/<app>.app
#   3. Run from the repo root:
#        maestro test .maestro/smoke.yaml
#
# `appId` must match `[bundle].identifier` in test-app/Dioxus.toml, which is
# what `dx build --platform ios` embeds into the generated Xcode project.
appId: com.example.TestApp
name: iOS boot + navigation smoke
---
# Cold start with cleared state so the JWT page starts unauthenticated.
- launchApp:
    clearState: false

# Route "/" — landing page.
- assertVisible: ".*Landing page for the dioxus-mobile test app.*"

- takeScreenshot: launch_verified

# FCM page. On the landing page both the nav link and a card are labelled
# "FCM"; the nav renders first in DOM order, so pin the first match.
- tapOn:
    text: "FCM"
    index: 0
- assertVisible: ".*Native bridge: switft inshallah"

# Handle native iOS permission prompt
- tapOn:
    text: "Request notification permission"
- runFlow:
    when:
      visible: ".*(Allow|OK).*"
    commands:
      - tapOn: ".*(Allow|OK).*"
- assertVisible: "Permission: granted"

# Tap to generate/display token
- tapOn:
    text: "Read FCM Token"
- assertVisible: "Token: .+"

# Copy token text from screen and log it
- copyTextFrom:
    text: "Token: .*"
- evalScript: ${console.log("Parsed FCM Token Output: " + maestro.copiedText)}

- takeScreenshot: fcm_token_verified

# Recorder page. Headings render without touching the mic; recording is not
# exercised here to avoid cpal/permission flakiness on the simulator.
- tapOn: "Recorder"
- assertVisible: ".*Acoustics Lab.*"
- assertVisible: ".*Recording Size.*"

# JWT page. From a non-landing page "JWT" only matches the nav link.
- tapOn: "JWT"
- assertVisible: ".*not authenticated.*"
- assertVisible: "Login"

# Enter Username (matches placeholder or label)
- tapOn:
    text: "username .*"
- eraseText
- inputText: "admin"

# Enter Password
- tapOn:
    text: "password.*"
- eraseText
- inputText: "password"

# Dismiss keyboard (optional but recommended for iOS to prevent tap obstruction)
- hideKeyboard

# Tap Login
- tapOn: "Login"

- assertVisible: "logged in"

# Force close and relaunch the app without resetting state
- stopApp
- launchApp:
    clearState: false

# Back to the landing page. "Init" only matches the nav link here.
- tapOn: "Init"
- assertVisible: ".*Landing page for the dioxus-mobile test app.*"

- tapOn: "JWT"
- assertVisible: "Status: authenticated"
- assertVisible: "Storage: persistent"
