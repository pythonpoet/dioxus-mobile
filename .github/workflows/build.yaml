name: Build iOS

on:
  push:
    branches: [main]

env:
  # Make Cargo use predictable locations inside the workspace.
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

  # Better for CI caches.
  CARGO_INCREMENTAL: 0

  # Optional, but reduces target directory size a lot.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Get Rust version from Nix dev shell
        id: rust
        run: |
          set -euo pipefail

          VERSION=$(
            nix develop --accept-flake-config .#ios --command rustc --version \
              | awk '{print $2}'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and git deps
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry/index
            .cargo-home/registry/cache
            .cargo-home/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-ios-${{ steps.rust.outputs.version }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-ios-${{ steps.rust.outputs.version }}-
            v2-${{ runner.os }}-${{ runner.arch }}-ios-

      - name: Verify Cargo environment
        run: |
          nix develop --accept-flake-config .#ios --command bash -lc '
            set -euxo pipefail

            printenv CARGO_HOME || true
            printenv CARGO_TARGET_DIR || true

            cargo --version
            rustc --version

            dx --version || true
          '

      # Optional but useful: fail early if dependencies cannot be fetched.
      - name: Fetch dependencies
        run: |
          nix develop --accept-flake-config .#ios --command bash -lc '
            cargo fetch --locked
          '

      - name: Install Maestro CLI
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export MAESTRO_CLI_NO_ANALYTICS=1

      - name: Build iOS app and Run Maestro Tests
        run: |
          nix develop --accept-flake-config .#ios --command bash << 'EOF'
            set -euo pipefail

            # SDK toolchain (real Xcode via the `xcrun` PATH shim) and iOS
            # linker selection are configured by the `.#ios` dev shell hook.
            # Do NOT export DEVELOPER_DIR/SDKROOT here: the Nix `cc` wrapper
            # would then point host linking at Xcode's macOS SDK and break the
            # build with `linking with cc failed`.

            export AWS_LC_SYS_CMAKE_BUILDER=1
            export AWS_LC_SYS_STATIC=1
            export PATH="$HOME/.maestro/bin:$PATH"
            export MAESTRO_CLI_NO_ANALYTICS=1

            # 1. One-shot build. `dx build` exits when the build finishes
            #    (deterministic pass/fail), unlike `dx serve`, which stays
            #    alive and only starts building after printing its banner.
            cd test-app
            dx build --platform ios --release
            cd ..

            APP="target/dx/test-app/release/ios/TestApp.app"
            if [ ! -d "$APP" ]; then
              echo "ERROR: expected app bundle not found: $APP"
              find target/dx/test-app -maxdepth 4 -name '*.app' -print
              exit 1
            fi

            # 2. Boot a simulator and block until it is fully booted.
            UDID="$(xcrun simctl list devices available | grep -m1 -Eo '\([0-9A-F-]{36}\)' | tr -d '()')"
            [ -n "$UDID" ] || { echo "ERROR: no available iOS simulator device"; exit 1; }
            echo "Booting simulator: $UDID"
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b
            open -a Simulator || true

            # 3. Install the freshly built app bundle.
            xcrun simctl install "$UDID" "$APP"

            # 4. Run the Maestro smoke test.
            maestro test .maestro/smoke.yaml
          EOF

      - name: Show target sizes
        if: always()
        run: |
          du -sh target || true
          du -sh target/* || true

      - name: List build output
        run: |
          find target -name '*.framework' -o -name '*.app' | head -50

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build
          path: |
            target/dx/
            target/aarch64-apple-ios-sim/release/
          if-no-files-found: warn
