name: Build iOS

on:
  push:
    branches: [main]

env:
  # Make Cargo use predictable locations inside the workspace.
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

  # Better for CI caches.
  CARGO_INCREMENTAL: 0

  # Optional, but reduces target directory size a lot.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

    # sccache: content-addressed compile cache, survives Cargo.lock changes.
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 5G


jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Get Rust version from Nix dev shell
        id: rust
        run: |
          set -euo pipefail

          VERSION=$(
            nix develop --accept-flake-config .#ios --command rustc --version \
              | awk '{print $2}'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and git deps
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry/index
            .cargo-home/registry/cache
            .cargo-home/git/db
            .sccache

          key: v2-${{ runner.os }}-${{ runner.arch }}-ios-${{ steps.rust.outputs.version }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-ios-${{ steps.rust.outputs.version }}-
            v2-${{ runner.os }}-${{ runner.arch }}-ios-

      - name: Verify Cargo environment
        run: |
          nix develop --accept-flake-config .#ios --command bash -lc '
            set -euxo pipefail

            printenv CARGO_HOME || true
            printenv CARGO_TARGET_DIR || true

            cargo --version
            rustc --version

            dx --version || true
          '

      # Optional but useful: fail early if dependencies cannot be fetched.
      - name: Fetch dependencies
        run: |
          nix develop --accept-flake-config .#ios --command bash -lc '
            cargo fetch --locked
          '

      - name: Install Maestro CLI
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export MAESTRO_CLI_NO_ANALYTICS=1

      - name: Launch dx serve and run Maestro tests
        timeout-minutes: 30
        run: |
          nix develop --accept-flake-config .#ios --command bash -lc '
            set -euo pipefail

            export DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer"
            unset CC CXX SDKROOT
            export CC="/usr/bin/clang"
            export CXX="/usr/bin/clang++"
            export LD="/usr/bin/ld"

            export AWS_LC_SYS_CMAKE_BUILDER=1
            export AWS_LC_SYS_STATIC=1

            export PATH="$HOME/.maestro/bin:$PATH"

            cd test-app
            dx serve --platform ios > ../dx_serve.log 2>&1 &
            DX_PID=$!
            cd ..

            cleanup() {
              kill -9 "$DX_PID" 2>/dev/null || true
              # Optional: xcrun simctl shutdown all 2>/dev/null || true
            }
            trap cleanup EXIT

            echo "Waiting for dx serve to build and launch the app..."

            found=0
            for _ in $(seq 1 600); do
              if grep -q "launching app!" dx_serve.log 2>/dev/null; then
                found=1
                echo "App launched successfully."
                break
              fi

              if ! kill -0 "$DX_PID" 2>/dev/null; then
                echo "dx serve exited unexpectedly. Last log output:"
                tail -n 100 dx_serve.log || true
                exit 1
              fi

              sleep 3
            done

            if [ "$found" -ne 1 ]; then
              echo "Timed out waiting for dx serve to launch the app. Last log output:"
              tail -n 100 dx_serve.log || true
              exit 1
            fi

            sleep 5

            cd ..
            maestro test .maestro/smoke.yaml
          '


      - name: Show target sizes
        if: always()
        run: |
          du -sh target || true
          du -sh target/* || true

      - name: List build output
        run: |
          find target -name '*.framework' -o -name '*.app' | head -50

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build
          path: |
            target/dx/
            target/aarch64-apple-ios-sim/release/
          if-no-files-found: warn
