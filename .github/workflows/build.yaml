name: Build iOS

on:
  push:
    branches: [main]

env:
  # Make Cargo use predictable locations inside the workspace.
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

  # Better for CI caches.
  CARGO_INCREMENTAL: 0

  # Optional, but reduces target directory size a lot.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

    # sccache: content-addressed compile cache, survives Cargo.lock changes.
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 5G


jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Get Rust version from Nix dev shell
        id: rust
        run: |
          set -euo pipefail

          VERSION=$(
            nix develop --accept-flake-config .#ios --command rustc --version \
              | awk '{print $2}'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and git deps
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry/index
            .cargo-home/registry/cache
            .cargo-home/git/db
            .sccache

          key: v2-${{ runner.os }}-${{ runner.arch }}-ios-${{ steps.rust.outputs.version }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-ios-${{ steps.rust.outputs.version }}-
            v2-${{ runner.os }}-${{ runner.arch }}-ios-

      - name: Verify Cargo environment
        run: |
          nix develop --accept-flake-config .#ios --command bash -lc '
            set -euxo pipefail

            printenv CARGO_HOME || true
            printenv CARGO_TARGET_DIR || true

            cargo --version
            rustc --version

            dx --version || true
          '

      # Optional but useful: fail early if dependencies cannot be fetched.
      - name: Fetch dependencies
        run: |
          nix develop --accept-flake-config .#ios --command bash -lc '
            cargo fetch --locked
          '

      - name: Install Maestro CLI
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export MAESTRO_CLI_NO_ANALYTICS=1

      - name: Launch dx serve and Run Maestro Tests
        run: |
          nix develop --accept-flake-config .#ios --command bash -lc '
            set -euo pipefail

            export DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer"
            unset CC CXX SDKROOT
            export CC="/usr/bin/clang"
            export CXX="/usr/bin/clang++"
            export LD="/usr/bin/ld"

            export AWS_LC_SYS_CMAKE_BUILDER=1
            export AWS_LC_SYS_STATIC=1

            export PATH="$HOME/.maestro/bin:$PATH"

            # 1. Start dx serve unbuffered in background and log to file
            cd test-app
            stdbuf -oL -eL dx serve --platform ios > ../dx_serve.log 2>&1 &
            DX_PID=$!
            cd ..

            # Automatically terminate dx serve when this step exits
            trap "kill -9 $DX_PID 2>/dev/null || true" EXIT

            # 2. Wait for dx serve to finish building and launch the app
            echo "Waiting for dx serve to build and launch the app..."
            while true; do
              if grep -q "launching app!" dx_serve.log 2>/dev/null; then
                break
              fi

              if grep -q "Build failed" dx_serve.log 2>/dev/null; then
                echo "Error: dx serve process exited with error." >&2
                cat dx_serve.log >&2
                exit 1
              fi

              if grep -q "ERROR dx build" dx_serve.log 2>/dev/null; then
                echo "Error: dx serve process exited with error." >&2
                cat dx_serve.log >&2
                exit 1
              fi

              if ! kill -0 $DX_PID 2>/dev/null; then
                echo "Error: dx serve process exited with error." >&2
                cat dx_serve.log >&2
                exit 1
              fi

              sleep 3
            done

            echo "App launched successfully."
            sleep 5  # Grace period for the app to fully initialize

            # 3. Run Maestro tests against the simulator launched by dx serve
            mkdir -p maestro-output
            maestro test --format junit --output maestro-output/report.xml .maestro/smoke.yaml
          '

      - name: Upload Maestro Artifacts
        uses: actions/upload-artifact@v4
        if: always() # Ensures logs/screenshots upload even if Maestro tests fail
        with:
          name: maestro-test-results
          path: |
            maestro-output/
            ~/.maestro/tests/
          if-no-files-found: warn

      - name: Show target sizes
        if: always()
        run: |
          du -sh target || true
          du -sh target/* || true

      - name: List build output
        run: |
          find target -name '*.framework' -o -name '*.app' | head -50

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build
          path: |
            target/dx/
            target/aarch64-apple-ios-sim/release/
          if-no-files-found: warn
