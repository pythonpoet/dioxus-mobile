name: Dioxus iOS CI

on:
  push:
    branches: [ "dev" ]


jobs:
  build-and-test:
    runs-on: macos-14 # Uses Apple Silicon (M1/M2) runners for faster compilation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-ios-sim
            x86_64-apple-ios

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: |
          cargo install dioxus-cli --force

      - name: Boot iOS Simulator
        uses: dotdoom/launch-ios-simulator@v1
        with:
          model: 'iPhone 15'
          os: 'iOS'
          wait_for_boot: true

      - name: Build App for Simulator
        run: |
          # Compiles the app targeting the iOS simulator
          cargo build --target aarch64-apple-ios-sim

      - name: Run Dioxus iOS App / Simulator Check
        run: |

          # Use Dioxus CLI to serve/test on the running iOS simulator
          cd test-app && dx serve --platform ios
