name: Dioxus iOS CI

on:
  push:
    branches: [ "dev" ]


jobs:
  build-and-test:
    runs-on: macos-14 # Uses Apple Silicon (M1/M2) runners for faster compilation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-ios-sim
            x86_64-apple-ios

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: |
          cargo install dioxus-cli --force

      - name: Boot iOS Simulator
        run: |
          # Find the UDID of an available iPhone 15 simulator (or iPhone 14 / latest)
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 15" | awk -F '[()]' '{print $2}')

          # Fallback to any available iPhone if iPhone 15 isn't matched directly
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | awk -F '[()]' '{print $2}')
          fi

          echo "Booting simulator UDID: $UDID"
          xcrun simctl boot "$UDID"

      - name: Build App for Simulator
        run: |
          # Compiles the app targeting the iOS simulator
          cargo build --target aarch64-apple-ios-sim

      - name: Run Dioxus iOS App / Simulator Check
        run: |

          # Use Dioxus CLI to serve/test on the running iOS simulator
          cd test-app && dx serve --platform ios
