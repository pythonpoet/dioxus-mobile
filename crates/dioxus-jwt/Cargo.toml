[package]
name = "dioxus-jwt"
version = "0.1.0"
edition = "2021"

[features]
default = ["client"]
# `client` needs dioxus's `fullstack` so `dioxus::prelude::dioxus_fullstack`
# (which provides `set_request_headers`/`HeaderMap`) resolves for `use_auth_headers`.
client = ["dep:dioxus", "dep:dioxus-sdk-storage", "dep:web-time", "dep:tracing", "dioxus?/fullstack"]
# The `server` feature offloads all validation/authentication logic to
# `axum-jwt-auth`. dioxus-jwt simply re-exports its API.
server = ["dep:axum-jwt-auth"]

[dependencies]
serde = { version = "1", features = ["derive"] }
jsonwebtoken = "10.4.0"
tracing = { version = "0.1.44", optional = true }

axum-jwt-auth = { version = "0.7", optional = true }

dioxus = { workspace = true, optional = true }
# SDK releases track the dioxus line — use the build published against 0.8
dioxus-sdk-storage = { git = "https://github.com/pythonpoet/sdk", branch = "main", optional = true }
web-time = { version = "1", optional = true }

# jsonwebtoken → p256 → getrandom 0.2: on wasm32-unknown-unknown `getrandom`
# needs the `js` feature or it fails to compile. Enable it so the crate can
# build for the web (wasm-bindgen) target. Harmless everywhere else.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }