[package]
name = "dioxus-fcm"
version = "0.1.0"
edition = "2024"

[dependencies]
once_cell = "1"
crossbeam-channel = "0.5"   # thread-safe token delivery to Rust
tracing = { version = "0.1.44", features = ["log"]}
manganis = { git = "https://github.com/pythonpoet/dioxus", branch = "main", version = "=0.8.0-alpha.1" }
tokio = { version = "1.53.0", features = ["sync", "time", "rt"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
parking_lot = "0.12"

[target.'cfg(target_os = "ios")'.dependencies]
# The Swift bridge (src/ios/plugin) is compiled and linked by dx itself via the
# #[manganis::ffi] macro in src/ios.rs; objc2 comes in through manganis::objc2, no
# extra crate needed here.
