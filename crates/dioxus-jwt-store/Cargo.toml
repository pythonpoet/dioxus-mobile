[package]
name = "dioxus-jwt-store"
version = "0.1.0"
edition = "2024"
[dependencies]
axum-jwt-auth = "0.7"          # pin exactly; pre-1.0, API moves
jsonwebtoken = "10.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
dioxus-sdk-storage = { git = "https://github.com/pythonpoet/sdk", branch = "main"}
